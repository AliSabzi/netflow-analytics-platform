namespace: netflow-demo

spark:
  image: spark:4.1.1-scala2.13-java17-ubuntu

master:
  replicas: 1
  sparkPort: 7077
  webUiPort: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  cores: 2
  memory: 1g


  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 3Gi

historyServer:
  replicas: 1
  imagePullPolicy: IfNotPresent

  webUiPort: 18080
  eventLogDir: hdfs://netflow-demo/data/spark-events
  javaHeap: 1g

  cleaner:
    enabled: true
    interval: 1d
    maxAge: 14d

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi