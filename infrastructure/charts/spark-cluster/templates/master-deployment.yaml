apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.master.replicas }}
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: {{ .Values.spark.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SPARK_DAEMON_JAVA_OPTS
              value: >-
                -Dspark.ui.reverseProxy=true
                -Dspark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
                -Dspark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus
                -Dspark.metrics.conf.master.sink.prometheusServlet.path=/metrics/master/prometheus
                -Dspark.metrics.conf.applications.sink.prometheusServlet.path=/metrics/applications/prometheus
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec /opt/spark/bin/spark-class \
                org.apache.spark.deploy.master.Master \
                --host spark-master.{{ .Values.namespace }}.svc.cluster.local \
                --port 7077 \
                --webui-port 8080

          ports:
            - name: spark
              containerPort: 7077

            - name: web-ui
              containerPort: 8080

          resources:
            requests:
              cpu: {{ .Values.master.resources.requests.cpu }}
              memory: {{ .Values.master.resources.requests.memory }}

            limits:
              cpu: {{ .Values.master.resources.limits.cpu }}
              memory: {{ .Values.master.resources.limits.memory }}
