apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: postgresql
    cluster-name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
    - name: patroni
      port: 8008
      targetPort: patroni
