apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
data:
  patroni.yml: |
    scope: postgresql

    bootstrap:
      dcs:
        postgresql:
          use_pg_rewind: true
          use_slots: true
          pg_hba:
            - local all all trust
            - host replication replicator 0.0.0.0/0 scram-sha-256
            - host all all 0.0.0.0/0 scram-sha-256
          parameters:
            password_encryption: scram-sha-256
            max_connections: {{ .Values.postgresql.maxConnections }}
            shared_buffers: {{ .Values.postgresql.sharedBuffers | quote }}

      initdb:
        - auth-host: scram-sha-256
        - auth-local: trust
        - encoding: UTF8
        - locale: C.UTF-8
        - data-checksums
      post_bootstrap: /usr/local/bin/bootstrap-netflow.sh

    kubernetes:
      use_endpoints: true
      ports:
        - name: postgresql
          port: 5432
      labels:
        application: patroni
        cluster-name: postgresql

    restapi:
      listen: 0.0.0.0:8008

    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /tmp/pgpass
