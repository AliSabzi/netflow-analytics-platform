apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
type: Opaque
stringData:
  superuser-username: postgres
  superuser-password: {{ required "credentials.superuserPassword is required" .Values.credentials.superuserPassword | quote }}
  replication-username: replicator
  replication-password: {{ required "credentials.replicationPassword is required" .Values.credentials.replicationPassword | quote }}
  application-username: {{ .Values.database.username | quote }}
  application-password: {{ required "credentials.applicationPassword is required" .Values.credentials.applicationPassword | quote }}
