replicas: 3

image:
  repository: ghcr.io/alisabzi/postgres-patroni
  tag: 18.6-4.1.5-1
  pullPolicy: IfNotPresent

credentials:
  superuserPassword: ""
  replicationPassword: ""
  applicationPassword: ""

database:
  name: netflow
  username: netflow_user

storage:
  className: disk1
  size: 100Gi

service:
  type: LoadBalancer
  port: 5432

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

postgresql:
  maxConnections: 100
  sharedBuffers: 768MB
