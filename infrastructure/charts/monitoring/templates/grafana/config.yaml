apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-0.prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          manageAlerts: true
          prometheusType: Prometheus
      - name: StarRocks
        uid: starrocks
        type: mysql
        access: proxy
        url: {{ .Values.starrocks.address | quote }}
        user: {{ .Values.starrocks.user | quote }}
        editable: false
        jsonData:
          database: information_schema
        secureJsonData:
          password: $STARROCKS_PASSWORD
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: NetFlow
        folder: NetFlow
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
