apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
type: Opaque
stringData:
  username: {{ .Values.grafana.adminUser | quote }}
  password: {{ required "grafana.adminPassword is required" .Values.grafana.adminPassword | quote }}
  starrocks-password: {{ required "starrocks.password is required" .Values.starrocks.password | quote }}
