{{- range .Values.applicationNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ $.Release.Namespace }}
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
