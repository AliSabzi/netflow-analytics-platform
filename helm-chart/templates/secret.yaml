{{- $secrets := .Values.secrets | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: netflow-secrets
type: Opaque
stringData:
  postgres-password: {{ required "Set secrets.postgresPassword or reuse existing release values" $secrets.postgresPassword | quote }}
  starrocks-password: {{ required "Set secrets.starrocksPassword or reuse existing release values" $secrets.starrocksPassword | quote }}
