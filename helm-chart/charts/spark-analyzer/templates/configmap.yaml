apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spark-analyzer.fullname" . }}-config
data:
  SPARK_TIMEZONE: {{ .Values.spark.timezone | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.javaToolOptions | quote }}
  HDFS_PARQUET_PATH: {{ .Values.hdfs.parquetPath | quote }}
  SPARK_MASTER: {{ .Values.spark.master | quote }}
  SPARK_EXECUTOR_CORES: {{ .Values.spark.executorCores | quote }}
  SPARK_EXECUTOR_MEMORY: {{ .Values.spark.executorMemory | quote }}
  POSTGRES_URL: {{ .Values.postgresql.url | quote }}
  POSTGRES_DRIVER: {{ .Values.postgresql.driver | quote }}
  POSTGRES_USERNAME: {{ .Values.postgresql.username | quote }}
  POSTGRES_TABLE_PROTOCOL_USAGE: {{ .Values.postgresql.tables.protocolUsage | quote }}
  POSTGRES_TABLE_IP_CONNECTIONS: {{ .Values.postgresql.tables.ipConnections | quote }}
  POSTGRES_TABLE_IP_BANDWIDTH: {{ .Values.postgresql.tables.ipBandwidth | quote }}
  METRICS_PORT: {{ .Values.metricsPort | quote }}
  PUSHGATEWAY_ADDRESS: {{ .Values.pushgatewayAddress | quote }}
