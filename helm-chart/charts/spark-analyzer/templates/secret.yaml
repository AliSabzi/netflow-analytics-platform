{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spark-analyzer.postgresqlSecretName" . }}
type: Opaque
stringData:
  postgres-password: {{ required "Set secret.password when secret.create=true" .Values.secret.password | quote }}
{{- end }}
