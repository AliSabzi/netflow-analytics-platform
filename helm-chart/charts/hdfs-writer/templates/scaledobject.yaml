apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "hdfs-writer.fullname" . }}
spec:
  scaleTargetRef:
    name: {{ include "hdfs-writer.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.global.kafka.bootstrapServers | quote }}
        consumerGroup: {{ .Values.kafka.groupId | quote }}
        topic: {{ .Values.kafka.topic | quote }}
        lagThreshold: {{ .Values.autoscaling.lagThreshold | quote }}
