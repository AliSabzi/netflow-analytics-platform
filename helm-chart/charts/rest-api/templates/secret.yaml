{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rest-api.secretName" . }}
type: Opaque
stringData:
  postgres-password: {{ required "Set secret.postgresPassword when secret.create=true" .Values.secret.postgresPassword | quote }}
  starrocks-password: {{ required "Set secret.starrocksPassword when secret.create=true" .Values.secret.starrocksPassword | quote }}
{{- end }}
