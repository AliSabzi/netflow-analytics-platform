apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rest-api.fullname" . }}-config
data:
  SERVER_PORT: {{ .Values.service.port | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.env.postgresUrl | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.env.postgresUser | quote }}
  STARROCKS_DATASOURCE_URL: {{ .Values.env.starrocksUrl | quote }}
  STARROCKS_DATASOURCE_USERNAME: {{ .Values.env.starrocksUser | quote }}
