apiVersion: v1
kind: ConfigMap

metadata:
  name: schema-registry-config

data:
  SCHEMA_REGISTRY_HOST_NAME: {{ .Values.service.name | quote }}
  SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:{{ .Values.containerPort }}"
  SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrapServers | quote }}